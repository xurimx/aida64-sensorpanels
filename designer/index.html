/* Layout: a black editor (the subject is an OLED panel). Toolbar on top; components and your PC on the left; the canvas in the
   middle; the inspector on the right. Below 900 px everything stacks: canvas first, then one panel at a time behind tabs. */
:root {
  --bg: #000000; --surface: #0B0C0E; --raised: #121417; --field: #111316; --line: #22262B; --line2: #2E3338;
  --fg: #E9EDF2; --muted: #8A939D; --dim: #5E666F; --accent: #3DD9C5; --accent-ink: #00110F; --warn: #F2B740; --bad: #FF6B60; --sel: #3DD9C5;
  --ui: "Segoe UI", "Selawik Local", system-ui, sans-serif; --mono: ui-monospace, Consolas, monospace;
  --s-2: .75rem; --s-1: .8125rem; --s0: .875rem; --s1: 1rem; --s2: 1.25rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: var(--s0); line-height: 1.4; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }
.app { height: 100dvh; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) minmax(0, 320px); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "left stage right"; }
.app > * { min-width: 0; min-height: 0; }

/* toolbar */
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 6px; min-width: 0; }
.brand a { color: var(--muted); text-decoration: none; font-size: var(--s-1); white-space: nowrap; }
.brand a:hover { color: var(--fg); }
.brand strong { font-weight: 600; white-space: nowrap; }
#doc-name { width: 14rem; max-width: 40vw; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; }
#doc-name:hover, #doc-name:focus { border-color: var(--line2); background: var(--field); }
.tb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tb .sp { flex: 1; }
.btn { border: 1px solid var(--line2); background: var(--raised); border-radius: 7px; padding: 5px 11px; font-size: var(--s-1); font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: #444b52; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.icon { padding: 5px 8px; min-width: 32px; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: var(--s-2); font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #1A1E22; color: var(--fg); }
.grow { flex: 1 1 auto; }

/* side panels */
.side { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 4px; font-size: var(--s-1); font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 12px; display: grid; gap: 14px; align-content: start; min-height: 0; flex: 1; }
h2 { font-size: var(--s-2); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h3 { font-size: var(--s0); font-weight: 600; margin: 0; }
p { margin: 0; }
.hint { font-size: var(--s-2); color: var(--muted); }
.hint b { color: var(--fg); font-weight: 600; }
.note { font-size: var(--s-2); color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.note.warn { color: var(--warn); border-color: #4a3a17; }

/* palette */
.pal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pal button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 8px; font-size: var(--s-1); touch-action: none; user-select: none; }
.pal button:hover { border-color: var(--line2); background: #171A1E; }
.pal svg { flex: none; width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
.ghost-drag { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: #1A1E22; border: 1px solid var(--accent); font-size: var(--s-1); transform: translate(-50%, -50%); }

/* your PC */
.steps { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; font-size: var(--s-1); color: var(--muted); }
.steps b { color: var(--fg); font-weight: 600; }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; margin-top: 4px; }
.cmd code { font-family: var(--mono); font-size: 11px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; word-break: break-all; max-height: 7.5em; overflow: auto; }
textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--field); border: 1px solid var(--line2); border-radius: 8px; padding: 8px; font-family: var(--mono); font-size: 11px; }
.drop { border: 1px dashed var(--line2); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted); font-size: var(--s-1); }
.drop.over, body.dragging .drop { border-color: var(--accent); color: var(--fg); }
.search { width: 100%; background: var(--field); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; }
.comp { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.comp > summary { list-style: none; cursor: pointer; padding: 8px 10px; display: flex; align-items: center; gap: 8px; background: var(--raised); font-weight: 600; font-size: var(--s-1); }
.comp > summary::-webkit-details-marker { display: none; }
.comp > summary .n { margin-left: auto; color: var(--muted); font-weight: 400; }
.comp .quick { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px 0; }
.comp .quick button { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--accent); touch-action: none; }
.sens { list-style: none; margin: 0; padding: 4px 0; }
.sens li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 4px 10px; cursor: grab; touch-action: none; user-select: none; font-size: var(--s-1); }
.sens li:hover { background: #15181B; }
.sens .id { grid-column: 1; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.sens .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.hw { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: var(--s-1); }
.hw dt { color: var(--muted); }
.hw dd { margin: 0; }

/* layers */
.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; font-size: var(--s-1); }
.layers li { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) auto; align-items: center; gap: 2px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.layers li.child { padding-left: 22px; }
.layers li:hover { background: #15181B; }
.layers li.sel { background: #10302C; }
.layers li.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.layers .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layers .ty { color: var(--dim); font-size: 11px; }
.layers button { border: 0; background: transparent; padding: 0; width: 20px; height: 20px; color: var(--muted); font-size: 12px; line-height: 1; }
.layers button { display: grid; place-items: center; }
.layers button.off { color: var(--dim); opacity: .55; }
.layers button.on { color: var(--warn); }
.layers li:not(:hover) button.off[aria-label="Lock"] { opacity: 0; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 5px; margin-left: 4px; }

/* SP.core: small helpers shared by the builder and the designer (colours, numbers, cp1252, canvas, fonts).
   Shared files are namespaced IIFEs because the pages that inline them declare their own top-level names. */
window.SP = window.SP || {};
SP.core = (() => {
  'use strict';
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgbToHex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const bgr = c => c[0] + (c[1] << 8) + (c[2] << 16);                           // AIDA64 stores colours as BGR decimal
  const fromBgr = n => { n = Number(n); return Number.isFinite(n) && n >= 0 ? [n & 255, (n >> 8) & 255, (n >> 16) & 255] : null; };
  const fmtNum = v => { const s = Number(v).toFixed(6).replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' || s === '' ? '0' : s; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /* Windows-1252. AIDA64 files are single-byte ANSI: ° is 0xB0, € is 0x80. Anything else becomes '?'. */
  const HI = [0x20AC, 0, 0x201A, 0x0192, 0x201E, 0x2026, 0x2020, 0x2021, 0x02C6, 0x2030, 0x0160, 0x2039, 0x0152, 0, 0x017D, 0,
              0, 0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2013, 0x2014, 0x02DC, 0x2122, 0x0161, 0x203A, 0x0153, 0, 0x017E, 0x0178];
  const ENC = new Map(HI.map((u, i) => [u, 0x80 + i]).filter(([u]) => u));
  function enc1252(text) {
    const out = new Uint8Array(text.length); let n = 0;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (c < 0x80 || (c >= 0xA0 && c < 0x100)) out[n++] = c;
      else { out[n++] = ENC.get(c) ?? 63; if (c >= 0xD800 && c < 0xDC00) i++; }       // a surrogate pair is one '?'
    }

  /* text that goes between <TAG>…</TAG>: no markup characters, no '|' (frame list separator), single line */

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

    return `${o.italic ? 'italic ' : ''}${w} ${px}px "${f.base}", ${f.fb}`;
  }

  return { rgb, hexToRgb, rgbToHex, bgr, fromBgr, fmtNum, clamp, enc1252, dec1252, clean, mk, rr, poly, stateOf, ptToPx, gdiPx, fontInfo, fontCss };
})();

/* SP.zip: minimal ZIP writer and reader. Deflate and inflate use the browser's (De)CompressionStream. */
window.SP = window.SP || {};
SP.zip = (() => {
  'use strict';
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  async function pipe(u8, stream) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
  async function deflateRaw(u8) {
    if (typeof CompressionStream === 'undefined') return null;
    try { return await pipe(u8, new CompressionStream('deflate-raw')); } catch (e) { return null; }
  }
  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unpack ZIP files');
    return pipe(u8, new DecompressionStream('deflate-raw'));
  }
  const put = (dv, fields) => fields.forEach(([o, v, s]) => s === 4 ? dv.setUint32(o, v, true) : dv.setUint16(o, v, true));

  /* makeZip(name, data) for one file, or makeZip([{name, data, store}]) for several. Entries are deflated
     unless store is set or deflating doesn't make them smaller. */
  async function makeZip(a, b) {
    const files = Array.isArray(a) ? a : [{ name: a, data: b }];
    const now = new Date(), dt = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1), dd = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);
      const nb = new TextEncoder().encode(f.name), utf8 = /[^\x00-\x7f]/.test(f.name) ? 0x0800 : 0, crc = crc32(data);
      let comp = f.store ? null : await deflateRaw(data), method = 8;
      if (!comp || comp.length >= data.length) { comp = data; method = 0; }
      const lh = new DataView(new ArrayBuffer(30));
      put(lh, [[0, 0x04034b50, 4], [4, 20, 2], [6, utf8, 2], [8, method, 2], [10, dt, 2], [12, dd, 2], [14, crc, 4], [18, comp.length, 4], [22, data.length, 4], [26, nb.length, 2], [28, 0, 2]]);
      const cd = new DataView(new ArrayBuffer(46));
      put(cd, [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, utf8, 2], [10, method, 2], [12, dt, 2], [14, dd, 2], [16, crc, 4], [20, comp.length, 4], [24, data.length, 4], [28, nb.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]);
      parts.push(lh, nb, comp); central.push(cd, nb);
      offset += 30 + nb.length + comp.length;
    }
    const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
    const eo = new DataView(new ArrayBuffer(22));
    put(eo, [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, offset, 4], [20, 0, 2]]);
    return new Blob([...parts, ...central, eo], { type: 'application/zip' });
  }

  /* readZip(bytes) -> Map(name -> Uint8Array). Stored and deflated entries; no ZIP64, no encryption. */
  async function readZip(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eo = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65535); i--) if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
    if (eo < 0) throw new Error('Not a ZIP file');
    const count = dv.getUint16(eo + 10, true); let p = dv.getUint32(eo + 16, true);
    const out = new Map();
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged ZIP directory');
      const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
      const nameBytes = u8.subarray(p + 46, p + 46 + nlen);
      const name = flags & 0x0800 ? new TextDecoder().decode(nameBytes) : new TextDecoder('windows-1252').decode(nameBytes);
      p += 46 + nlen + xlen + clen;
      if (flags & 1) throw new Error('Encrypted ZIP entries are not supported');
      if (dv.getUint32(lho, true) !== 0x04034b50) throw new Error('Damaged ZIP entry');
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const raw = u8.subarray(start, start + csize);
      if (name.endsWith('/')) continue;
      if (method === 0) out.set(name, raw.slice());
      else if (method === 8) out.set(name, await inflateRaw(raw));
      else throw new Error(`Unsupported ZIP compression (${method}) in ${name}`);
    }
    return out;
  }

  return { crc32, deflateRaw, inflateRaw, makeZip, readZip };
})();

<script>
/* SP.writer: model -> AIDA64 SensorPanel files.
   model = { w, h, items, imgs }  items in draw order, imgs: Map(name -> canvas | Uint8Array | Blob).
   Item kinds: IMG {name,x,y, rw?,rh?, bg?}  DIV {text}  LBL {text,x,y,pt,font,col,bold?,italic?,shadow?}
               GAUGE {sensor,slabel,lo,hi,x,y,frames,showVal,pt,font,col, typ?,siz?,rw?,rh?,ptRaw?,bold?,italic?,icon?}
               SIMPLE {sensor,slabel,x,y,pt,unit,col,align,font, bold?,italic?,showLabel?,label?}
               GRAPH {sensor,slabel,x,y,w,h,lo,hi,col,auto,step,thick, type?,density?,gridCol?,bgCol?,frameCol?,flags?,showScale?,scalePt?,scaleFont?,scaleCol?,scaleBI?}
               SITEM / RAW {id, x, y, tags:[[k,v]...]}  (AIDA64 items we pass through untouched)
   Any item may set hidden: true (AIDA64's '-' prefix). Optional fields default to what the builder always wrote,
   so builder exports are unchanged byte for byte. */
window.SP = window.SP || {};
SP.writer = (() => {
  'use strict';
  const { bgr, fmtNum, enc1252, clean } = SP.core;
  const HEX = Array.from({ length: 256 }, (_, i) => i.toString(16).padStart(2, '0').toUpperCase());
  function toHex(u8) { const parts = []; for (let i = 0; i < u8.length; i += 32768) { let s = ''; const e = Math.min(u8.length, i + 32768); for (let j = i; j < e; j++) s += HEX[u8[j]]; parts.push(s); } return parts.join(''); }
  const pngBytes = c => new Promise((res, rej) => c.toBlob(b => b ? b.arrayBuffer().then(a => res(new Uint8Array(a)), rej) : rej(new Error('PNG encoding failed')), 'image/png'));
  async function imgBytes(src) {
    if (!src) throw new Error('missing image');
    if (src instanceof Uint8Array) return src;
    if (src instanceof Blob) return new Uint8Array(await src.arrayBuffer());
    return pngBytes(src);
  }
  const GRID = bgr([19, 21, 24]), HAIR = bgr([28, 31, 36]), LO = bgr([84, 92, 101]);   // builder's graph colours
  const SIZE_TAGS = new Set(['ITMX', 'ITMY', 'WID', 'HEI', 'UNTWID', 'BARWID', 'BARHEI', 'BARIND', 'RESIZW', 'RESIZH']);

  /* names of the images a model needs: IMG items in order, then gauge frames (sorted, like AIDA64 writes them) */
  function imageNames(model) {
    const img = [], frames = new Set();
    for (const it of model.items) {
      if (it.kind === 'IMG' && !img.includes(it.name)) img.push(it.name);
      if (it.kind === 'GAUGE' && it.frames) it.frames.forEach(f => f && frames.add(f));
    }
    return { img, frames: [...frames].sort() };
  }

  function itemLine(it, P, T, v200, hex) {
    const h = it.hidden ? '-' : '';
    const xy = `<ITMX>${P(it.x)}</ITMX><ITMY>${P(it.y)}</ITMY>`;
    switch (it.kind) {
      case 'IMG': {
        const rs = it.rw ? `<RESIZW>${P(it.rw)}</RESIZW><RESIZH>${P(it.rh)}</RESIZH>` : '';
        if (v200) return `<ID>${h}IMG</ID><BGIMG>${it.bg ? 1 : 0}</BGIMG>${rs}${xy}<IMGFIL>${clean(it.name)}</IMGFIL>`;
        if (rs || it.bg) return `<ID>${h}IMG</ID><BGIMG>${it.bg ? 1 : 0}</BGIMG>${rs}${xy}<IMGFIL>${clean(it.name)}</IMGFIL><IMGDAT>${hex.get(it.name)}</IMGDAT>`;
        return `<ID>${h}IMG</ID><URL></URL>${xy}<IMGFIL>${clean(it.name)}</IMGFIL><IMGDAT>${hex.get(it.name)}</IMGDAT>`;
      }
      case 'DIV':
        return `<ID>-LBL</ID><TXTSIZ>8</TXTSIZ><FNTNAM></FNTNAM><LBL>${clean(it.text)}</LBL><LBLCOL>16777215</LBLCOL><LBLBIS>000</LBLBIS><SHDCOL>0</SHDCOL><SHDDIS>1</SHDDIS><SHDDEP>1</SHDDEP><URL></URL><ITMX>0</ITMX><ITMY>0</ITMY>`;
      case 'LBL':
        return `<ID>${h}LBL</ID><TXTSIZ>${T(it.pt)}</TXTSIZ><FNTNAM>${clean(it.font)}</FNTNAM><LBL>${clean(it.text)}</LBL><LBLCOL>${bgr(it.col)}</LBLCOL>`
          + `<LBLBIS>${it.bold ? 1 : 0}${it.italic ? 1 : 0}${it.shadow ? 1 : 0}</LBLBIS><SHDCOL>${it.shadowCol ? bgr(it.shadowCol) : 0}</SHDCOL><SHDDIS>${it.shadowDis || 1}</SHDDIS><SHDDEP>${it.shadowDep || 1}</SHDDEP><URL></URL>${xy}`;
      case 'GAUGE': {
        const typ = it.typ || 'Custom';
        const rs = it.rw ? `<RESIZW>${P(it.rw)}</RESIZW><RESIZH>${P(it.rh)}</RESIZH>` : '';
        const txt = it.showVal ? T(it.pt) : (it.ptRaw ?? 8);
        return `<ID>${h}[GAUGE]${clean(it.sensor)}</ID><LBL>${clean(it.slabel)}</LBL><TYP>${clean(typ)}</TYP><SIZ>${it.siz || 'S'}</SIZ>${rs}<MINVAL>${fmtNum(it.lo)}</MINVAL><MAXVAL>${fmtNum(it.hi)}</MAXVAL>`
          + `<SHWICO>${it.icon ? 1 : 0}</SHWICO><SHWVAL>${it.showVal ? 1 : 0}</SHWVAL><TXTSIZ>${txt}</TXTSIZ><FNTNAM>${clean(it.font)}</FNTNAM><VALCOL>${bgr(it.col)}</VALCOL><VALBI>${it.bold ? 1 : 0}${it.italic ? 1 : 0}</VALBI>${xy}`
          + (typ === 'Custom' || it.frames?.length ? `<STAFLS>${(it.frames || []).map(clean).join('|')}</STAFLS>` : '');
      }
      case 'SIMPLE':
        return `<ID>${h}[SIMPLE]${clean(it.sensor)}</ID><TXTSIZ>${T(it.pt)}</TXTSIZ><FNTNAM>${clean(it.font)}</FNTNAM><TXTCOL>${bgr(it.col)}</TXTCOL><TXTBIR>${it.bold ? 1 : 0}${it.italic ? 1 : 0}${it.align === 'r' ? 1 : 0}</TXTBIR>`
          + `<SHWLBL>${it.showLabel ? 1 : 0}</SHWLBL><LBL>${clean(it.label ?? it.slabel)}</LBL><SHWUNT>${it.unit ? 1 : 0}</SHWUNT><UNT>${clean(it.unit)}</UNT>${xy}`;
      case 'GRAPH':
        return `<ID>${h}[GRAPH]${clean(it.sensor)}</ID><LBL>${clean(it.slabel)}</LBL><TYP>${it.type || 'LG'}</TYP><WID>${P(it.w)}</WID><HEI>${P(it.h)}</HEI><GPHSTP>${it.step}</GPHSTP><GPHTCK>${it.thick}</GPHTCK>`
          + `<GRDDNS>${it.density ?? 40}</GRDDNS><MINVAL>${fmtNum(it.lo)}</MINVAL><MAXVAL>${fmtNum(it.hi)}</MAXVAL><AUTSCL>${it.auto ? 1 : 0}</AUTSCL><GRDCOL>${it.gridCol ? bgr(it.gridCol) : GRID}</GRDCOL>`
          + `<GPHCOL>${bgr(it.col)}</GPHCOL><BGCOL>${it.bgCol ? bgr(it.bgCol) : 0}</BGCOL><FRMCOL>${it.frameCol ? bgr(it.frameCol) : HAIR}</FRMCOL><GPHBFG>${it.flags || '000'}</GPHBFG><SHWSCL>${it.showScale ? 1 : 0}</SHWSCL>`
          + `<TXTSIZ>${it.scalePt ?? 8}</TXTSIZ><FNTNAM>${clean(it.scaleFont || 'Segoe UI')}</FNTNAM><SCLCOL>${it.scaleCol ? bgr(it.scaleCol) : LO}</SCLCOL><SCLBI>${it.scaleBI || '000'}</SCLBI>${xy}`;
      case 'SITEM': case 'RAW': {
        let s = `<ID>${h}${clean(it.id)}</ID>`;
        for (const [k, v] of it.tags) {
          if (k === 'ID') continue;
          if (k === 'ITMX') s += `<ITMX>${P(it.x)}</ITMX>`;
          else if (k === 'ITMY') s += `<ITMY>${P(it.y)}</ITMY>`;
          else if (k === 'TXTSIZ' && v !== '') s += `<TXTSIZ>${T(+v)}</TXTSIZ>`;
          else if (SIZE_TAGS.has(k) && v !== '' && Number.isFinite(+v)) s += `<${k}>${P(+v)}</${k}>`;
          else s += `<${k}>${clean(v)}</${k}>`;
        }
        return s;
      }
    }
    return null;
  }

  function scalers(dpi) { const s = dpi / 100; return [v => Math.round(v / s), pt => Math.max(1, Math.round(pt / s))]; }
  const header = (model, P, v200) => [v200 ? '<SPVER>200</SPVER><SWVER>7.50.7200</SWVER>' : '<SPVER>100</SPVER><SWVER>7.35.7000</SWVER>',
    `<SPWIDTH>${P(model.w)}</SPWIDTH><SPHEIGHT>${P(model.h)}</SPHEIGHT><SPBGCOLOR>0</SPBGCOLOR>`];

  /* SPVER 100 .sensorpanel: images as hex, gauge frames once at the end. AIDA64 multiplies positions, text size and
     panel size by the Windows scale (not images), so those are divided by dpi / 100 first. Returns cp1252 bytes. */
  async function writePanel(model, progress = () => {}, dpi = 100) {
    const [P, T] = scalers(dpi);
    const { img, frames } = imageNames(model);
    const names = [...img, ...frames.filter(f => !img.includes(f))];
    const hex = new Map();
    for (let i = 0; i < names.length; i++) { hex.set(names[i], toHex(await imgBytes(model.imgs.get(names[i])))); if (i % 12 === 0) progress(i / names.length); }
    const L = header(model, P, false);
    for (const it of model.items) { const line = itemLine(it, P, T, false, hex); if (line) L.push(line); }
    for (const n of frames) L.push(`<GAUSTAFNM>${n}</GAUSTAFNM><GAUSTADAT>${hex.get(n)}</GAUSTADAT>`);
    progress(1);
    return enc1252(L.join('\r\n') + '\r\n');
  }

  /* SPVER 200 .sp2 text plus the image files it names (for .spzip). */
  async function writeSp2(model, progress = () => {}, dpi = 100) {
    const [P, T] = scalers(dpi);
    const { img, frames } = imageNames(model);
    const names = [...img, ...frames.filter(f => !img.includes(f))];
    const files = [];
    for (let i = 0; i < names.length; i++) { files.push({ name: names[i], data: await imgBytes(model.imgs.get(names[i])) }); if (i % 12 === 0) progress(i / names.length); }
    const L = header(model, P, true);
    for (const it of model.items) { const line = itemLine(it, P, T, true, null); if (line) L.push(line); }
    progress(1);
    return { sp2: enc1252(L.join('\r\n') + '\r\n'), files };
  }

  /* .spzip: one YYYY-MM-DD.sp2 plus loose images; extra = [{name, data}] (e.g. designer.json) */
  async function writeSpzip(model, progress = () => {}, dpi = 100, extra = []) {
    const { sp2, files } = await writeSp2(model, progress, dpi);
    const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    return SP.zip.makeZip([{ name: `${stamp}.sp2`, data: sp2 }, ...files, ...extra]);
  }

  return { writePanel, writeSp2, writeSpzip, toHex, pngBytes, imgBytes, imageNames };
})();
//# sourceURL=src/shared/sp-writer.js

<script>
/* SP.parse: read AIDA64 SensorPanel files (.sensorpanel = SPVER 100 with hex images, .sp2 = SPVER 200 inside .spzip).
   Line grammar: <TAG>value</TAG> pairs, any order, every tag optional, numbers may be floats ("1024.00").
   A '-' before the ID hides the item. Text is cp1252 unless a BOM says UTF-16 or UTF-8 (AIDA64 7.99+ writes UTF-16 .sp2). */
window.SP = window.SP || {};
SP.parse = (() => {
  'use strict';
  const { fromBgr } = SP.core;
  const TAG = /<([A-Z0-9]+)>([\s\S]*?)<\/\1>/g;

  function decode(bytes) {
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), encoding: 'utf-16le' };
    if (bytes[0] === 0xFE && bytes[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), encoding: 'utf-16be' };
    if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), encoding: 'utf-8' };
    return { text: new TextDecoder('windows-1252').decode(bytes), encoding: 'windows-1252' };
  }
  const HEXV = (() => { const t = new Int8Array(128).fill(-1); for (let i = 0; i < 16; i++) { t['0123456789ABCDEF'.charCodeAt(i)] = i; t['0123456789abcdef'.charCodeAt(i)] = i; } return t; })();
  function unhex(s) {
    const out = new Uint8Array(s.length >> 1);
    for (let i = 0, j = 0; j < out.length; i += 2, j++) out[j] = (HEXV[s.charCodeAt(i)] << 4) | HEXV[s.charCodeAt(i + 1)];
    return out;
  }
  const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };

  /* -> { ver, swver, w, h, bgcolor, items: [{id, hidden, kind, sensor, tags: [[k, v]…]}], images: Map(name -> bytes), encoding } */
  function parsePanel(bytes) {
    const { text, encoding } = decode(bytes);
    const head = {}, items = [], images = new Map();
    for (const line of text.split(/\r?\n/)) {
      if (!line.trim()) continue;
      const tags = [];
      for (const m of line.matchAll(TAG)) tags.push([m[1], m[2]]);
      if (!tags.length) continue;
      const get = k => tags.find(t => t[0] === k)?.[1];
      if (get('GAUSTAFNM') !== undefined) { images.set(get('GAUSTAFNM'), unhex(get('GAUSTADAT') || '')); continue; }
      const id = get('ID');
      if (id === undefined) { for (const [k, v] of tags) head[k] = v; continue; }
      const hidden = id.startsWith('-'), raw = hidden ? id.slice(1) : id;
      const m = raw.match(/^\[(SIMPLE|GAUGE|GRAPH|ARC)\](.*)$/);
      const kind = m ? m[1] : raw === 'LBL' || raw === 'IMG' ? raw : 'SITEM';
      const keep = tags.filter(([k]) => k !== 'IMGDAT');
      if (kind === 'IMG' && get('IMGDAT') !== undefined && get('IMGFIL') !== undefined) images.set(get('IMGFIL'), unhex(get('IMGDAT')));
      items.push({ id: raw, hidden, kind, sensor: m ? m[2] : kind === 'SITEM' ? raw : null, tags: keep });
    }
    return { ver: num(head.SPVER), swver: head.SWVER || '', w: num(head.SPWIDTH), h: num(head.SPHEIGHT), bgcolor: head.SPBGCOLOR, items, images, encoding };
  }

  /* .spzip -> parsed panel (images come from the zip; an optional designer.json is returned as text) */
  async function parseSpzip(bytes) {
    const files = await SP.zip.readZip(bytes);
    const sp2 = [...files.keys()].find(n => /\.sp2$/i.test(n));
    if (!sp2) throw new Error('No .sp2 layout inside this .spzip');
    const p = parsePanel(files.get(sp2));
    for (const [n, b] of files) if (n !== sp2 && !p.images.has(n)) p.images.set(n, b);
    const dj = [...files.keys()].find(n => /(^|\/)designer\.json$/i.test(n));
    p.designer = dj ? new TextDecoder().decode(files.get(dj)) : null;
    return p;
  }

  /* parsed item -> writer model item (see sp-writer.js). Unknown kinds stay as SITEM/RAW tag lists. */
  function toItem(pi) {
    const t = Object.fromEntries(pi.tags), col = v => fromBgr(v) || [255, 255, 255];
    const base = { hidden: pi.hidden, x: num(t.ITMX), y: num(t.ITMY) };
    const lbl = t.LBL ?? '';
    switch (pi.kind) {
      case 'IMG': {
        const it = { kind: 'IMG', ...base, name: t.IMGFIL || '' };
        if (t.RESIZW) { it.rw = num(t.RESIZW); it.rh = num(t.RESIZH); }
        if (t.BGIMG === '1') it.bg = true;
        return it;
      }
      case 'LBL':
        /* hidden labels in the usual divider form are group separators; anything else stays a (hidden) label */
        if (pi.hidden && (t.TXTSIZ ?? '8') === '8' && !t.FNTNAM && num(t.ITMX) === 0 && num(t.ITMY) === 0) return { kind: 'DIV', text: lbl };
        return { kind: 'LBL', ...base, text: lbl, pt: num(t.TXTSIZ) || 8, font: t.FNTNAM || '', col: col(t.LBLCOL), bold: t.LBLBIS?.[0] === '1', italic: t.LBLBIS?.[1] === '1',
                 shadow: t.LBLBIS?.[2] === '1', shadowCol: fromBgr(t.SHDCOL) || [0, 0, 0], shadowDis: num(t.SHDDIS) || 1, shadowDep: num(t.SHDDEP) || 1 };
      case 'SIMPLE':
        return { kind: 'SIMPLE', ...base, sensor: pi.sensor, slabel: lbl, label: lbl, showLabel: t.SHWLBL === '1', pt: num(t.TXTSIZ) || 8, font: t.FNTNAM || 'Segoe UI',
                 col: col(t.TXTCOL), bold: t.TXTBIR?.[0] === '1', italic: t.TXTBIR?.[1] === '1', align: t.TXTBIR?.[2] === '1' ? 'r' : 'l', unit: t.SHWUNT === '0' ? '' : (t.UNT || '') };
      case 'GAUGE': {
        const it = { kind: 'GAUGE', ...base, sensor: pi.sensor, slabel: lbl, typ: t.TYP || 'Custom', siz: t.SIZ || 'S', lo: num(t.MINVAL), hi: num(t.MAXVAL),
                     icon: t.SHWICO === '1', showVal: t.SHWVAL === '1', pt: num(t.TXTSIZ) || 8, font: t.FNTNAM || 'Segoe UI', col: col(t.VALCOL),
                     bold: t.VALBI?.[0] === '1', italic: t.VALBI?.[1] === '1', frames: t.STAFLS !== undefined ? t.STAFLS.split('|') : [] };
        if (!it.showVal) it.ptRaw = num(t.TXTSIZ) || 8;

      }

                 density: num(t.GRDDNS), lo: num(t.MINVAL), hi: num(t.MAXVAL), auto: t.AUTSCL === '1', gridCol: col(t.GRDCOL), col: col(t.GPHCOL), bgCol: fromBgr(t.BGCOL) || [0, 0, 0],
                 frameCol: col(t.FRMCOL), flags: t.GPHBFG || '000', showScale: t.SHWSCL === '1', scalePt: num(t.TXTSIZ) || 8, scaleFont: t.FNTNAM || 'Segoe UI',

<script>
/* SP.render: draw AIDA64 model items the way AIDA64 does (see sp-writer.js for the item shapes).
   io = { val(sensor) -> number, str(sensor) -> formatted text, hist(sensor) -> array (oldest first),
          img(name) -> CanvasImageSource | null, panel: {w, h} }
   SIMPLE and LBL: ITMY is the top of the GDI text cell. A Custom GAUGE shows frame stateOf(v) and, with SHWVAL,
   prints its value centred on ITMX/ITMY. Native AIDA64 gauges and sensor items are approximated. */
window.SP = window.SP || {};
SP.render = (() => {
  'use strict';
  const { rgb, stateOf, gdiPx, fontInfo, fontCss } = SP.core;

  function text(ctx, s, x, y, it, o = {}) {
    const px = gdiPx(o.pt ?? it.pt), f = fontInfo(o.font ?? it.font);
    ctx.font = fontCss(o.font ?? it.font, px, { bold: o.bold ?? it.bold, italic: o.italic ?? it.italic });
    ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'alphabetic';
    const yb = o.centre ? y - (f.asc + f.desc) * px / 2 + f.asc * px : y + f.asc * px;
    if (o.shadow) { ctx.fillStyle = rgb(o.shadow); ctx.fillText(s, x + (o.sd || 1), yb + (o.sd || 1)); }
    ctx.fillStyle = rgb(o.col ?? it.col); ctx.fillText(s, x, yb);
    return { px, f };
  }

  function graph(ctx, it, io) {
    const x = Math.round(it.x), y = Math.round(it.y), w = Math.round(it.w), h = Math.round(it.h);
    const fl = it.flags || '000';
    if (fl[0] === '1') { ctx.fillStyle = rgb(it.bgCol || [0, 0, 0]); ctx.fillRect(x, y, w, h); }
    if (fl[2] === '1' && it.density > 0) {
      ctx.fillStyle = rgb(it.gridCol || [40, 40, 40]);
      for (let gx = x + w; gx > x; gx -= it.density) ctx.fillRect(gx, y, 1, h);
      for (let gy = y + h; gy > y; gy -= it.density) ctx.fillRect(x, gy, w, 1);
    }
    const hist = io.hist(it.sensor) || [], step = Math.max(1, it.step || 1), n = Math.min(hist.length, Math.ceil(w / step) + 1);
    if (n >= 2) {
      let min = it.lo, max = it.hi;
      if (it.auto) { let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, hist[hist.length - 1 - i]); max = Math.max(m * 1.15, 1); min = 0; }
      const ty = v => y + h - Math.max(0, Math.min(1, (v - min) / (max - min || 1))) * (h - 2);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h + 1); ctx.clip();
      ctx.strokeStyle = ctx.fillStyle = rgb(it.col);
      if (it.type === 'HG') {
        const bw = Math.max(1, it.thick || 1);
        for (let i = 0; i < n; i++) { const yy = ty(hist[hist.length - 1 - i]); ctx.fillRect(x + w - i * step - bw, yy, bw, y + h - yy); }
      } else {
        ctx.beginPath();
        for (let i = 0; i < n; i++) { const px = x + w - i * step, py = ty(hist[hist.length - 1 - i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
        if (it.type === 'AG') { ctx.lineTo(x + w - (n - 1) * step, y + h); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill(); }
        else { ctx.lineWidth = it.thick || 1; ctx.lineJoin = 'round'; ctx.stroke(); }
      }
      ctx.restore();
    }
    if (fl[1] === '1') { ctx.strokeStyle = rgb(it.frameCol || [80, 80, 80]); ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); }
  }

  /* AIDA64's built-in gauge skins aren't available: a plain dial with the value */
  function nativeGauge(ctx, it, io) {
    const r = { S: 48, M: 72, L: 96 }[it.siz] || 48, cx = it.x + r, cy = it.y + r, v = io.val(it.sensor);
    const t = Math.max(0, Math.min(1, (v - it.lo) / ((it.hi - it.lo) || 1)));
    ctx.strokeStyle = 'rgb(70,70,70)'; ctx.lineWidth = Math.max(2, r / 12);
    ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth, 0.75 * Math.PI, 2.25 * Math.PI); ctx.stroke();
    ctx.strokeStyle = it.typ === 'White' ? 'rgb(235,235,235)' : 'rgb(200,200,200)';
    ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth, 0.75 * Math.PI, (0.75 + 1.5 * t) * Math.PI); ctx.stroke();
    if (it.showVal) text(ctx, io.str(it.sensor), cx, cy, it, { align: 'center', centre: true });
  }

  /* AIDA64 "sensor item": label, value and unit in one row of width WID, optional bar */
  function sensorItem(ctx, it, io) {
    const t = Object.fromEntries(it.tags), n = k => parseFloat(t[k]) || 0, col = k => SP.core.fromBgr(t[k]) || [255, 255, 255];
    const pt = n('TXTSIZ') || 8, font = t.FNTNAM || 'Segoe UI', wid = n('WID') || 200, uw = t.SHWUNT === '1' ? n('UNTWID') : 0;
    const x = it.x, y = it.y, sid = it.id;
    const bis = k => ({ bold: t[k]?.[0] === '1', italic: t[k]?.[1] === '1' });
    if (t.SHWLBL === '1') text(ctx, t.LBL || '', x, y, { pt, font }, { col: col('LBLCOL'), ...bis('LBLBIS') });
    if (t.SHWVAL === '1') text(ctx, io.str(sid), x + wid - uw, y, { pt, font }, { col: col('VALCOL'), align: 'right', ...bis('VALBIS') });
    if (uw) text(ctx, t.UNT || '', x + wid - uw + 4, y, { pt, font }, { col: col('UNTCOL'), ...bis('UNTBIS') });
    if (t.SHWBAR === '1' && t.BARMAX !== '') {
      const px = gdiPx(pt), bw = n('BARWID') || 100, bh = n('BARHEI') || 10, by = y + px * 1.35, bx = x + n('BARIND');
      const v = io.val(sid), lo = n('BARMIN'), hi = n('BARMAX') || 100, f = Math.max(0, Math.min(1, (v - lo) / ((hi - lo) || 1)));
      const band = v >= n('BARLIM3') && t.BARLIM3 !== '' ? 'BARLIM3' : v >= n('BARLIM2') && t.BARLIM2 !== '' ? 'BARLIM2' : v >= n('BARLIM1') && t.BARLIM1 !== '' ? 'BARLIM1' : 'BARMIN';
      ctx.fillStyle = rgb(col(band + 'BGC')); ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = rgb(col(band + 'FGC')); bw < bh ? ctx.fillRect(bx, by + bh * (1 - f), bw, bh * f) : ctx.fillRect(bx, by, bw * f, bh);
      if (t.BARFS?.[0] === '1') { ctx.strokeStyle = rgb(col('BARFRMCOL')); ctx.lineWidth = 1; ctx.strokeRect(bx + .5, by + .5, bw - 1, bh - 1); }
    }
  }

  function item(ctx, it, io) {
    if (it.hidden) return;
    switch (it.kind) {
      case 'IMG': {
        const im = io.img(it.name); if (!im) return;
        if (it.bg && io.panel) ctx.drawImage(im, 0, 0, io.panel.w, io.panel.h);
        else if (it.rw) ctx.drawImage(im, Math.round(it.x), Math.round(it.y), it.rw, it.rh);
        else ctx.drawImage(im, Math.round(it.x), Math.round(it.y));
        return;
      }
      case 'GAUGE': {
        if ((it.typ || 'Custom') !== 'Custom') return nativeGauge(ctx, it, io);
        const v = io.val(it.sensor), fr = it.frames?.length ? it.frames[stateOf(v, it.lo, it.hi, it.frames.length)] : '';
        if (fr) { const im = io.img(fr); if (im) it.rw ? ctx.drawImage(im, Math.round(it.x), Math.round(it.y), it.rw, it.rh) : ctx.drawImage(im, Math.round(it.x), Math.round(it.y)); }
        if (it.showVal) text(ctx, io.str(it.sensor), it.x, it.y, it, { align: 'center', centre: true });
        return;
      }
      case 'SIMPLE': {
        const s = (it.showLabel ? (it.label ?? it.slabel ?? '') : '') + io.str(it.sensor) + (it.unit || '');
        text(ctx, s, Math.round(it.x), Math.round(it.y), it, { align: it.align === 'r' ? 'right' : 'left' });
        return;
      }
      case 'LBL':
        text(ctx, io.label ? io.label(it.text) : it.text, Math.round(it.x), Math.round(it.y), it, { shadow: it.shadow ? it.shadowCol || [0, 0, 0] : null, sd: it.shadowDis });
        return;
      case 'GRAPH': return graph(ctx, it, io);
      case 'SITEM': return sensorItem(ctx, it, io);
    }
  }

  /* screen box of an item, for hit tests and overlap checks (text boxes are estimates) */
  function box(it, io) {
    const x = it.x, y = it.y;
    switch (it.kind) {
      case 'IMG': { const im = io?.img?.(it.name); return [x, y, it.rw || im?.width || 0, it.rh || im?.height || 0]; }
      case 'GRAPH': return [x, y, it.w, it.h];
      case 'GAUGE': {
        const im = it.frames?.find(Boolean) && io?.img?.(it.frames.find(Boolean));
        if (it.showVal && !im) { const px = gdiPx(it.pt), f = fontInfo(it.font), w = px * f.digit * 4; return [x - w / 2, y - (f.asc + f.desc) * px / 2, w, (f.asc + f.desc) * px]; }
        return [x, y, it.rw || im?.width || 0, it.rh || im?.height || 0];
      }
      case 'SIMPLE': case 'LBL': {
        const px = gdiPx(it.pt), f = fontInfo(it.font), w = it.w || px * f.digit * ((it.text || '').length || 5), h = (f.asc + f.desc) * px;
        return [it.align === 'r' ? x - w : x, y, w, h];
      }
      case 'SITEM': { const t = Object.fromEntries(it.tags); return [x, y, +t.WID || 200, gdiPx(+t.TXTSIZ || 8) * 1.4 + (t.SHWBAR === '1' ? +t.BARHEI || 10 : 0)]; }
    }
    return [x, y, 0, 0];
  }

  function model(ctx, m, io) { for (const it of m.items) item(ctx, it, io); }

  return { item, model, box, text };
})();

<script>
/* ================================================================ Your PC: AIDA64 sensor lists and hardware detection
   Inputs (auto-detected):
   - .reg file from  reg export HKCU\Software\FinalWire\AIDA64\SensorValues …   (UTF-16LE: "Label.TCPU"="CPU")
   - reg query paste  (    Label.TCPU    REG_SZ    CPU)
   - shared-memory XML (<temp><id>TCPU</id><label>CPU</label><value>45</value></temp>…, no root element)
   - also: tab-separated id/label/value lines, or JSON from Get-ItemProperty | ConvertTo-Json
   Everything stays in the browser. IP-address values are dropped while parsing. */
const PC_MAX = 5000;
const normId = id => String(id || '').trim().replace(/-0+(\d)/g, '-$1');
const xmlText = s => s.replace(/&(amp|lt|gt|quot|apos|#\d+);/g, (m, e) => ({ amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" })[e] ?? String.fromCharCode(+e.slice(1)));
const XML_CAT = { sys: 'System', temp: 'Temperatures', fan: 'Fans', duty: 'Fan duty', volt: 'Voltage', curr: 'Current', pwr: 'Power', flow: 'Flow & liquid', liq: 'Flow & liquid' };

function pcDecode(input) {
  if (typeof input === 'string') return input;
  const b = input instanceof Uint8Array ? input : new Uint8Array(input);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder().decode(b.subarray(3));
  if (b.length > 3 && b[1] === 0 && b[3] === 0) return new TextDecoder('utf-16le').decode(b);          // UTF-16 without BOM
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { return new TextDecoder('windows-1252').decode(b); }
}

/* -> { source, sensors: Map(id -> {label, value, num, dec, cat}), warnings: [] } or throws with a readable message */
function parseSensorList(input) {
  const text = pcDecode(input).replace(/\u0000+$/, '');
  const pairs = new Map(), meta = new Map();          // id -> {label, value}; meta: id -> xml category
  const put = (id, k, v) => { id = normId(id); if (!/^[A-Z][A-Z0-9-]*$/i.test(id)) return; const o = pairs.get(id) || {}; o[k] = v; pairs.set(id, o); };
  let source = '';
  if (/<id>[\s\S]*?<\/id>/i.test(text)) {
    source = 'shared memory';
    const re = /<(sys|temp|fan|duty|volt|curr|pwr|flow|liq)>\s*<id>([\s\S]*?)<\/id>\s*<label>([\s\S]*?)<\/label>\s*<value>([\s\S]*?)<\/value>\s*<\/\1>/gi;
    for (const m of text.matchAll(re)) { put(m[2], 'label', xmlText(m[3])); put(m[2], 'value', xmlText(m[4])); meta.set(normId(m[2]), XML_CAT[m[1].toLowerCase()]); }
  } else if (/^\s*[{\[]/.test(text)) {
    source = 'JSON';
    let o; try { o = JSON.parse(text); } catch (e) { throw new Error('That looks like JSON but it can’t be read.'); }
    if (Array.isArray(o)) o = o[0] || {};
    for (const [k, v] of Object.entries(o)) { const m = k.match(/^(Label|Value)\.(.+)$/i); if (m) put(m[2], m[1].toLowerCase(), String(v ?? '')); }
  } else {
    const unesc = s => s.replace(/\\(.)/g, '$1');
    for (let line of text.split(/\r?\n/)) {
      let m;
      if ((m = line.match(/^"((?:Label|Value)\.[^"\\]*(?:\\.[^"\\]*)*)"\s*=\s*"((?:[^"\\]|\\.)*)"\s*$/i))) {
        source ||= '.reg file'; const [, k, id] = unesc(m[1]).match(/^(Label|Value)\.(.+)$/i); put(id, k.toLowerCase(), unesc(m[2]));
      } else if ((m = line.match(/^"((?:Label|Value)\.[^"]+)"\s*=\s*dword:([0-9a-f]{8})\s*$/i))) {
        source ||= '.reg file'; const [, k, id] = m[1].match(/^(Label|Value)\.(.+)$/i); put(id, k.toLowerCase(), String(parseInt(m[2], 16)));
      } else if ((m = line.match(/^\s+(Label|Value)\.(\S+)\s+REG_(?:SZ|EXPAND_SZ|DWORD)\s*(.*?)\s*$/i))) {
        source ||= 'registry paste'; let v = m[3]; if (/^0x[0-9a-f]+$/i.test(v)) v = String(parseInt(v, 16)); put(m[2], m[1].toLowerCase(), v);
      } else if ((m = line.match(/^([A-Z][A-Z0-9-]{1,30})\t([^\t]*)\t([^\t]*)$/))) {
        source ||= 'table'; put(m[1], 'label', m[2]); put(m[1], 'value', m[3]);
      }
    }
  }

  for (const [id, o] of pairs) {
    if (sensors.size >= PC_MAX) break;
    let value = o.value ?? '';
    if (/IPADDR$/.test(id)) value = '';                                   // never keep IP addresses
    const t = value.trim().replace(',', '.'), num = /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null;
    const dec = num === null ? 0 : (t.split('.')[1] || '').length;
    sensors.set(id, { label: (o.label ?? '').trim() || SP.catalog.label(id), value, num, dec, cat: meta.get(id) || SP.catalog.family(id).cat });
  }

  const warnings = [];
  if (![...sensors.keys()].some(id => id[0] === 'S'))
    warnings.push('No system readings (clocks, loads, drives, network). In AIDA64’s External Applications page click Select All, press OK, then export again.');
  const temps = [...sensors].filter(([id, s]) => id[0] === 'T' && s.num !== null).map(([, s]) => s.num).sort((a, b) => a - b);
  if (temps.length && temps[temps.length >> 1] > 100) warnings.push('Temperatures look like Fahrenheit. Panels show what AIDA64 reports; switch AIDA64 to Celsius for °C.');
  return { source: source || 'text', at: Date.now(), sensors, warnings };
}

/* ---- hardware profile ---- */

  pCores: 6, eCores: 8, threads: 20, smt: true, cpuTemp: 'TCPUPKG',

  nic: 6, dimms: [2, 4],
  fans: [{ id: 'FCPU', label: 'CPU FAN', max: 3000 }, { id: 'FAIOPUMP', label: 'PUMP', max: 4500 }, { id: 'FCHA1', label: 'CASE 1', max: 3000 },
         { id: 'FCHA2', label: 'CASE 2', max: 3000 }, { id: 'FCHA3', label: 'CASE 3', max: 3000 }, { id: 'FGPU1', label: 'GPU FAN', max: 3000 }],
  extras: { thr: true, limit: true, vramTemp: true, vramClk: true, dimm: true, hpwr: true, coolant: true, board: true, refresh: true, netx: true },

function inferHw(list) {

                hpwr: has(`PGPU${g}12VHPWR`), coolant: has('TWATER'), board: has('TMOBO') || has('TVRM') || has('TPCH'), refresh: has('SVREFRATE'), netx: has(`SNIC${hw.nic}TOTDL`) };

function fanLabel(id, label, gpu, pumps) {
  let m;

/* is a sensor reported? 'yes' | 'sometimes' (only while RTSS, media players… run) | 'no' | 'unknown' (no list loaded) */
function sensorStatus(list, id) {

  return SP.catalog.family(id).sometimes ? 'sometimes' : 'no';

<script>
/* ================================================================ preview: simulated readings for any sensor
   Typical values come from SP.catalog.family(id); a loaded PC sensor list replaces them with that PC's snapshot.
   Scenarios: load (gaming-like), idle, pc (the snapshot, when a list is loaded). */
const SIM = (() => {
  const S = new Map(), HIST = new Map(), HLEN = 700;
  let scen = 'load', pc = null;
  const t0 = Date.now() - (3 * 3600 + 12 * 60) * 1000;
  const pad = n => String(n).padStart(2, '0');
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0) / 4294967296; };
  function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  function spec(id) {
    const f = SP.catalog.family(id), snap = pc?.sensors.get(id);
    const s = { kind: f.kind, dec: f.dec, min: Math.min(f.lo, 0), max: f.hi * 1.5 + 1, sigma: f.sigma, mu: f.mu, sample: f.sample, unit: f.unit };
    if (f.kind !== 'num') { s.text = snap?.value || f.sample; return s; }
    const j = hash(id) - .5, range = f.hi - f.lo;
    if (/UTI$/.test(id) && !/^SDRV/.test(id)) s.mu += j * range * .3;
    else if (id[0] === 'T') s.mu += j * 6;
    else if (/^SCC-/.test(id)) s.mu += Math.round(j * 4) * 100;
    if (scen === 'idle') {
      if (/UTI$|ACT$/.test(id) && !/^SDRV/.test(id)) s.mu = 1 + Math.abs(j) * 6;
      else if (id[0] === 'T') s.mu = 20 + (s.mu - 20) * .55;
      else if (id[0] === 'P') s.mu *= .2;
      else if (/CLK$|^SCC-/.test(id)) s.mu *= .45;
      else if (id[0] === 'F') s.mu *= .7;
      else if (/FPS|FRAPS/.test(id)) s.mu = 0;
      else if (/RATE$|SPD$/.test(id)) s.mu *= .05;
    }
    if (snap && snap.num !== null && (scen === 'pc' || !/FPS/.test(id))) { if (scen === 'pc') s.mu = snap.num; s.dec = snap.dec; }
    s.mu = Math.max(s.min, Math.min(s.max, s.mu));

    return s;
  }
  function ensure(id) {
    let s = S.get(id);
    if (!s) { s = spec(id); s.val = s.mu; S.set(id, s); HIST.set(id, Array(HLEN).fill(s.mu)); }
    return s;
  }
  function tick() {
    for (const [id, s] of S) {
      if (s.kind !== 'num') continue;
      s.val += .35 * (s.mu - s.val) + s.sigma * gauss();
      s.val = Math.max(s.min, Math.min(s.max, s.val));

    }

    for (const [id, s] of S) { const n = spec(id); Object.assign(s, n, { val: snapNow ? n.mu : s.val }); }
  }
  function str(id) {
    const s = ensure(id), d = new Date();

      case 'date': return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
      case 'time': return /NS$/.test(id) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      case 'uptime': { const t = Math.floor((Date.now() - t0) / 1000); return `${Math.floor(t / 3600)}:${pad(Math.floor(t / 60) % 60)}` + (/NS$/.test(id) ? '' : `:${pad(t % 60)}`); }
      case 'text': return s.text ?? '';
    }
    return s.val.toFixed(s.dec);
  }
  return {
    val: id => { const s = ensure(id); return s.kind === 'num' ? s.val : 0; },
    str, hist: id => (ensure(id), HIST.get(id)), ensure, tick,
    warm(n = 620) { for (let i = 0; i < n; i++) tick(); },
    setPc(list) { pc = list || null; if (!pc && scen === 'pc') scen = 'load'; reseed(true); },
    setScenario(sc) { scen = sc === 'pc' && !pc ? 'load' : sc; reseed(true); },
    scenario: () => scen, hasPc: () => !!pc,
    set(id, v) { const s = ensure(id); s.val = s.mu = v; },
  };
})();

<script>
/* ================================================================ design document

                        neu: '#a6b2c0', amber: '#f2b740', red: '#ff5d52', fps: '#cfd6de', cpu: '#3dd9c5', gpu: '#a08cff' };

                         redband: '#682015', redminor: '#963c2d', ctitle: '#8c8578', unit: '#6c665c', window: '#2e2e2e', chair: '#222222', meter: '#4a4640',
                         mnum: '#968f80', needle: '#f28036', tail: '#3e3832', hubfill: '#0a0a0a', hubring: '#3e3e3e', hubdot: '#282828',

                      neu: 'Neutral', amber: 'Warm', red: 'Hot', fps: 'Frame rate', cpu: 'CPU accent', gpu: 'GPU accent', needle: 'Needles',
                      live: 'Dial readings', livesm: 'Small readings', major: 'Major ticks', num: 'Scale numbers', redband: 'Red zone',
                      bezel: 'Dial bezel', bezel2: 'Inner bezel', minor: 'Small ticks', cmid: 'Mid ticks', cred: 'Red ticks', redminor: 'Red small ticks',
                      ctitle: 'Dial titles', unit: 'Dial units', window: 'Readout window', chair: 'Meter hairline', meter: 'Meter base', mnum: 'Meter numbers',

<script>
/* ================================================================ painter: what a widget draws
   emit(P, p, box) records, in widget-local coordinates, an ordered list of
   - static runs: canvas drawing that ends up in the background PNG (or its own IMG when it must sit above a reading)
   - items: AIDA64 SIMPLE / GAUGE / GRAPH / LBL / IMG
   Gauge frames go to a shared registry, named by content, and are drawn only when needed. */
const STATIC_FONTS = { sel: '"Selawik Local", "Segoe UI", sans-serif', bsc: '"Barlow SC Local", sans-serif' };
const STATIC_FONT_NAMES = [['sel', 'Selawik (Segoe UI look)'], ['bsc', 'Barlow Semi Condensed']];
const WGT = { light: 300, reg: 400, med: 500, semi: 600, bold: 700 };
const MEASURE = document.createElement('canvas').getContext('2d');
const { rgb: cssRgb, mk, rr, poly } = SP.core;

const fontStr = (px, weight, family) => `${WGT[weight] || weight || 400} ${px}px ${STATIC_FONTS[family] || STATIC_FONTS.sel}`;
/* per-character advance plus letter spacing (em), exactly like the builder's width()/tl() */
function textWidth(s, px, weight, family, sp = 0) {
  MEASURE.font = fontStr(px, weight, family); let t = 0, n = 0;
  for (const ch of s) { t += MEASURE.measureText(ch).width; n++; }
  return t + sp * px * Math.max(0, n - 1);
}
function fillSpaced(ctx, x, yb, s, px, weight, family, col, sp = 0) {
  ctx.font = fontStr(px, weight, family); ctx.fillStyle = cssRgb(col); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let cx = x; for (const ch of s) { ctx.fillText(ch, cx, yb); cx += ctx.measureText(ch).width + sp * px; }
  return cx - sp * px;
}
/* ascent/descent of the static fonts, used to place a text box around its baseline */
const STATIC_METRICS = { sel: { asc: 0.94, desc: 0.24 }, bsc: { asc: 0.96, desc: 0.24 } };
/* ink box of a string relative to its baseline origin (for Pillow-style ink-centred text) */
function inkBox(s, px, weight, family) {
  MEASURE.font = fontStr(px, weight, family); const m = MEASURE.measureText(s);
  return { l: -m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, t: -m.actualBoundingBoxAscent, b: m.actualBoundingBoxDescent };
}

/* ---- shared gauge frames: name -> { w, h, draw(ctx), canvas } ---- */
const FRAMES = new Map();
const cyrb = s => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
function frameCanvas(name) {
  const f = FRAMES.get(name); if (!f) return null;
  if (!f.canvas) { f.canvas = mk(f.w, f.h); f.draw(f.canvas.getContext('2d')); }
  return f.canvas;
}

/* ---- gauge stacks. AIDA64 custom gauges have 16 states: state = floor((v - min) / (max - min) * 15) ----
   cumulative (bars, rings): each gauge lights its own segments. chunk must divide 15 so segment edges are exact.
   exclusive (needles, pointers): positions 0..n; exactly one gauge shows the needle, the others show a blank frame. */
function planCumulative(segs) {
  const chunk = [15, 5, 3, 1].find(c => segs % c === 0);
  return Array.from({ length: segs / chunk }, (_, g) => ({ first: g * chunk, count: chunk, lit: s => Math.floor(s * chunk / 15) }));
}
function planExclusive(n, overrange = true) {
  const G = Math.max(1, Math.ceil(n / 14)), out = [];
  for (let g = 0; g < G; g++) {
    const states = [];
    for (let s = 0; s < 16; s++) {
      const p = 14 * g + s;
      if (g > 0 && s === 0) states.push(null);                 // the previous gauge shows this position
      else if (p <= n) states.push(s === 15 ? null : p);       // s 15 here belongs to the next gauge's state 1
      else states.push(overrange ? 'over' : n);
    }
    out.push({ base: 14 * g, states });
  }
  return out;
}

/* ring geometry, as in the builder: segments of SPAN degrees every PITCH degrees from START */
function arcPts(cx, cy, r0, r1, a0, a1) {
  const n = Math.max(6, Math.floor((a1 - a0) * 3)), pts = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; pts.push([cx + r1 * Math.sin(a), cy - r1 * Math.cos(a)]); }
  for (let i = 0; i <= n; i++) { const a = (a1 - (a1 - a0) * i / n) * Math.PI / 180; pts.push([cx + r0 * Math.sin(a), cy - r0 * Math.cos(a)]); }
  return pts;
}

function makePainter(env) {
  const ops = [];
  let run = null;
  const grow = (b, x0, y0, x1, y1) => { b[0] = Math.min(b[0], x0); b[1] = Math.min(b[1], y0); b[2] = Math.max(b[2], x1); b[3] = Math.max(b[3], y1); };
  const P = {
    env, ops,
    col: v => colorOf(v, env.doc),
    /* static drawing: bounds [x0, y0, x1, y1] in local px */
    paint(b, fn) {
      if (!run) { run = { t: 'static', b: [Infinity, Infinity, -Infinity, -Infinity], fns: [] }; ops.push(run); }
      grow(run.b, b[0], b[1], b[2], b[3]); run.fns.push(fn);
    },
    breakRun() { run = null; },
    rect(x, y, w, h, c) { const col = P.col(c); P.paint([x, y, x + w, y + h], ctx => { ctx.fillStyle = cssRgb(col); ctx.fillRect(x, y, w, h); }); },
    rrect(x, y, w, h, r, c) { const col = P.col(c); P.paint([x, y, x + w, y + h], ctx => { ctx.fillStyle = cssRgb(col); rr(ctx, x, y, w, h, r); }); },
    stroke(x, y, w, h, r, lw, c) { const col = P.col(c); P.paint([x - lw, y - lw, x + w + lw, y + h + lw], ctx => { ctx.strokeStyle = cssRgb(col); ctx.lineWidth = lw; ctx.beginPath(); ctx.roundRect(x + lw / 2, y + lw / 2, w - lw, h - lw, r); ctx.stroke(); }); },
    poly(pts, c) {
      const col = P.col(c); let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      P.paint([x0 - 1, y0 - 1, x1 + 1, y1 + 1], ctx => { ctx.fillStyle = cssRgb(col); poly(ctx, pts); });
    },
    /* Pillow-style outlined circle: the outline sits inside radius r */
    circle(cx, cy, r, lw, c) { const col = P.col(c); P.paint([cx - r - 1, cy - r - 1, cx + r + 1, cy + r + 1], ctx => { ctx.strokeStyle = cssRgb(col); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, r - lw / 2), 0, Math.PI * 2); ctx.stroke(); }); },
    /* text on a baseline; align l | c | r; returns the end x (like the builder's tl) */
    text(x, yb, s, o) {
      const px = o.px, w8 = o.weight || 'reg', fam = o.family || 'sel', sp = o.spacing || 0, col = P.col(o.col || '@hi');
      if (!s) return x;
      const w = textWidth(s, px, w8, fam, sp), x0 = o.align === 'r' ? x - w : o.align === 'c' ? x - w / 2 : x;
      const m = STATIC_METRICS[fam] || STATIC_METRICS.sel;
      P.paint([x0 - px * .1, yb - px * (m.asc + .1), x0 + w + px * .1, yb + px * (m.desc + .1)], ctx => fillSpaced(ctx, x0, yb, s, px, w8, fam, col, sp));
      return x0 + w;
    },
    /* Pillow text_center(): centre the visible ink (no spacing) or the advance width (spacing) on (x, y) */
    textInk(x, y, s, o) {
      const px = o.px, w8 = o.weight || 'reg', fam = o.family || 'bsc', sp = o.spacing || 0, col = P.col(o.col);
      const ib = inkBox(s, px, w8, fam), by = y - (ib.t + ib.b) / 2;
      const x0 = sp ? x - textWidth(s, px, w8, fam, sp) / 2 : x - ib.l - (ib.r - ib.l) / 2;
      P.paint([x0 - px * .2, y - px, x0 + (ib.r - ib.l) + px * .2 + sp * px * s.length, y + px], ctx => fillSpaced(ctx, x0, by, s, px, w8, fam, col, sp));
    },
    custom(b, fn) { P.paint(b, fn); },
    /* live items; box = [x, y, w, h] used for the flatten overlap test */
    item(it, box) { run = null; ops.push({ t: 'item', it, box }); return it; },
    frames(prefix, keyParts, n, w, h, draw) {
      const key = cyrb(JSON.stringify(keyParts)), names = [];
      for (let i = 0; i < n; i++) {
        const name = `${prefix}_${key}_${String(i).padStart(2, '0')}.png`;
        if (!FRAMES.has(name)) FRAMES.set(name, { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)), draw: c => draw(c, i) });
        names.push(name);
      }
      return names;
    },
  };
  return P;
}

<script>
/* ================================================================ widget registry and basic primitives
   defineWidget({ type, label, cat, kind: 'primitive' | 'composite' | 'imported', resize: 'free' | 'aspect' | 'x' | 'none',
                  size: {w, h}, defaults(env), fields, sensors(p), measure(p, env) -> {w, h}, anchor(p), scale(p, f),
                  emit(P, p, box) | expand(p, box, env) })
   Fields drive the inspector, multi-select editing, sanitizing untrusted files and defaults. */
const WT = {};
function defineWidget(def) { WT[def.type] = { resize: 'free', fields: [], sensors: () => [], ...def }; return WT[def.type]; }

const LIVE_FONTS = ['Segoe UI', 'Segoe UI Light', 'Segoe UI Semilight', 'Segoe UI Semibold', 'Bahnschrift', 'Bahnschrift Light', 'Bahnschrift SemiBold',
                    'Consolas', 'Cascadia Mono', 'Arial', 'Arial Narrow', 'Calibri', 'Tahoma', 'Verdana', 'Trebuchet MS'];
const ALIGN3 = [['l', 'Left'], ['c', 'Centre'], ['r', 'Right']];
const WEIGHTS = [['light', 'Light'], ['reg', 'Regular'], ['med', 'Medium'], ['semi', 'Semibold'], ['bold', 'Bold']];
const ASC_SEGOE = 2210 / 2048;

/* sensor label for the file's LBL tag: the PC's own label when a list is loaded, else the catalogue's */
function sensorLabel(id, env) { return env?.pc?.sensors.get(id)?.label || SP.catalog.label(id); }
/* sample text that sizes a value's box: the widest likely reading plus its unit */
function valueSample(p) {
  if (p.sample) return p.sample;
  const f = SP.catalog.family(p.sensor);
  const s = f.kind === 'date' ? '30.12.2026' : f.kind === 'time' ? (/NS$/.test(p.sensor) ? '00:00' : '00:00:00') : f.kind === 'uptime' ? '123:45:00'
    : f.kind === 'text' ? (f.sample || 'Text') : (Math.max(Math.abs(f.hi), Math.abs(f.lo), 10) * (f.unit === '%' ? 1 : 1.1)).toFixed(f.dec);
  return (p.showLabel ? p.label || '' : '') + s + (p.unit || '');
}
function liveTextBox(s, pt, font, o = {}) {
  const px = SP.core.ptToPx(pt), f = SP.core.fontInfo(font);
  MEASURE.font = SP.core.fontCss(font, px, o);
  return { w: Math.max(4, MEASURE.measureText(s).width), h: (f.asc + f.desc) * px, asc: f.asc * px };
}

/* ---- text: static text baked into the image, or a native AIDA64 label ---- */
defineWidget({
  type: 'text', label: 'Text', cat: 'Text & shapes', resize: 'aspect',
  defaults: () => ({ text: 'LABEL', native: false, px: 28, weight: 'bold', family: 'sel', color: '@title', spacing: .14, align: 'l', upper: false,
                     font: 'Segoe UI', pt: 16, bold: false, italic: false }),
  fields: [
    { k: 'text', t: 'text', label: 'Text', max: 200 },
    { k: 'native', t: 'bool', label: 'AIDA64 label', hint: 'Drawn by AIDA64 with a Windows font, so $CPUMODEL and $GPU1MODEL work. Otherwise baked into the image.' },
    { k: 'px', t: 'num', label: 'Size px', min: 4, max: 600, show: p => !p.native },
    { k: 'weight', t: 'select', label: 'Weight', opts: WEIGHTS, show: p => !p.native },
    { k: 'family', t: 'select', label: 'Font', opts: STATIC_FONT_NAMES, show: p => !p.native },
    { k: 'spacing', t: 'num', label: 'Letter spacing', min: -.2, max: 1, step: .01, show: p => !p.native },
    { k: 'font', t: 'font', label: 'Font', live: true, show: p => p.native },
    { k: 'pt', t: 'int', label: 'Size pt', min: 4, max: 400, show: p => p.native },
    { k: 'bold', t: 'bool', label: 'Bold', show: p => p.native }, { k: 'italic', t: 'bool', label: 'Italic', show: p => p.native },
    { k: 'color', t: 'color', label: 'Colour' },
    { k: 'align', t: 'select', label: 'Align', opts: ALIGN3, show: p => !p.native },
    { k: 'upper', t: 'bool', label: 'Capitals' },
  ],
  str: p => p.upper ? p.text.toUpperCase() : p.text,
  measure(p) {
    const s = this.str(p) || ' ';
    if (p.native) { const b = liveTextBox(s, p.pt, p.font, p); return { w: b.w, h: b.h }; }
    const m = STATIC_METRICS[p.family] || STATIC_METRICS.sel;
    return { w: Math.max(2, textWidth(s, p.px, p.weight, p.family, p.spacing)), h: (m.asc + m.desc) * p.px };
  },
  anchor: p => p.native ? 'l' : p.align,
  scale(p, f) { if (p.native) p.pt = Math.max(4, Math.round(p.pt * f)); else p.px = Math.max(4, +(p.px * f).toFixed(2)); },
  emit(P, p, box) {
    const s = this.str(p);
    if (p.native) return P.item({ kind: 'LBL', x: 0, y: 0, text: s, pt: Math.round(p.pt), font: p.font, col: P.col(p.color), bold: p.bold, italic: p.italic, w: box.w }, [0, 0, box.w, box.h]);
    const m = STATIC_METRICS[p.family] || STATIC_METRICS.sel;
    P.text(p.align === 'r' ? box.w : p.align === 'c' ? box.w / 2 : 0, m.asc * p.px, s, { px: p.px, weight: p.weight, family: p.family, col: p.color, spacing: p.spacing, align: p.align });
  },
});

/* ---- value: one live reading (AIDA64 SIMPLE item; centred values use a gauge with empty frames) ---- */
defineWidget({
  type: 'value', label: 'Value', cat: 'Readings', resize: 'aspect',
  defaults: () => ({ sensor: 'SCPUUTI', pt: 24, font: 'Segoe UI', color: '@hi', unit: '', align: 'l', bold: false, italic: false, showLabel: false, label: '', sample: '' }),
  fields: [
    { k: 'sensor', t: 'sensor', label: 'Sensor' },
    { k: 'unit', t: 'text', label: 'Unit', max: 16, hint: 'Printed after the value, e.g. " °C" or " MHz". Centred values can’t show a unit.' },
    { k: 'font', t: 'font', label: 'Font', live: true }, { k: 'pt', t: 'int', label: 'Size pt', min: 4, max: 400 },
    { k: 'color', t: 'color', label: 'Colour' }, { k: 'align', t: 'select', label: 'Align', opts: ALIGN3 },
    { k: 'bold', t: 'bool', label: 'Bold' }, { k: 'italic', t: 'bool', label: 'Italic' },
    { section: 'More', fields: [
      { k: 'showLabel', t: 'bool', label: 'Text before the value' }, { k: 'label', t: 'text', label: 'Text', max: 40, show: p => p.showLabel },
      { k: 'sample', t: 'text', label: 'Size the box for', max: 40, hint: 'Example reading used to size the box, e.g. 8888.' },
    ] },
  ],
  sensors: p => [p.sensor],
  sanitize(p, raw) { if (raw.slabel) p.slabel = sStr(raw.slabel, 80); },
  measure(p) { const b = liveTextBox(valueSample(p), p.pt, p.font, p); return { w: b.w, h: b.h }; },
  anchor: p => p.align,
  scale(p, f) { p.pt = Math.max(4, Math.round(p.pt * f)); },
  emit(P, p, box) {
    const base = { sensor: p.sensor, slabel: p.slabel || sensorLabel(p.sensor, P.env), pt: p.pt, font: p.font, col: P.col(p.color) };
    if (p.align === 'c')
      return P.item({ kind: 'GAUGE', ...base, lo: 0, hi: 100, x: box.w / 2, y: box.h / 2, frames: Array(16).fill(''), showVal: true, bold: p.bold, italic: p.italic }, [0, 0, box.w, box.h]);
    P.item({ kind: 'SIMPLE', ...base, x: p.align === 'r' ? box.w : 0, y: 0, unit: p.unit, align: p.align, bold: p.bold, italic: p.italic,
             ...(p.showLabel ? { showLabel: true, label: p.label } : {}) }, [0, 0, box.w, box.h]);
  },
});

/* ---- rect: lines, dividers, accents, frames ---- */
defineWidget({
  type: 'rect', label: 'Rectangle', cat: 'Text & shapes', size: { w: 400, h: 2 },
  defaults: () => ({ fill: '@hair', radius: 0, outline: false, lineW: 2 }),
  fields: [{ k: 'fill', t: 'color', label: 'Colour' }, { k: 'outline', t: 'bool', label: 'Outline only' },
           { k: 'lineW', t: 'num', label: 'Line width', min: 1, max: 50, show: p => p.outline }, { k: 'radius', t: 'num', label: 'Corner radius', min: 0, max: 500 }],
  emit(P, p, box) {
    if (p.outline) return P.stroke(0, 0, box.w, box.h, p.radius, p.lineW, p.fill);
    p.radius > 0 ? P.rrect(0, 0, box.w, box.h, p.radius, p.fill) : P.rect(0, 0, box.w, box.h, p.fill);
  },
});

/* ---- image: a picture from the user (baked) or from an opened panel (kept as its own IMG) ---- */
defineWidget({
  type: 'image', label: 'Image', cat: 'Text & shapes', resize: 'free', size: { w: 400, h: 300 },
  defaults: () => ({ asset: '', name: 'image.png', separate: false, bg: false }),
  fields: [{ k: 'separate', t: 'bool', label: 'Keep as its own image', hint: 'Stays a separate item in AIDA64 instead of being merged into the background.' }],
  sanitize(p, raw) { p.asset = typeof raw.asset === 'string' && /^[a-z0-9]{1,40}$/.test(raw.asset) ? raw.asset : ''; p.name = sStr(raw.name, 120).replace(/[<>|\\/:*?"]/g, '') || 'image.png'; p.bg = !!raw.bg; },
  emit(P, p, box) {
    const a = P.env.asset(p.asset);
    if (p.separate || p.bg) {
      const same = a && Math.round(box.w) === a.w && Math.round(box.h) === a.h;
      return P.item({ kind: 'IMG', name: p.name, x: 0, y: 0, asset: p.asset, ...(same ? {} : { scaleTo: [Math.round(box.w), Math.round(box.h)] }), ...(p.bg ? { bg: true } : {}) }, [0, 0, box.w, box.h]);
    }
    P.custom([0, 0, box.w, box.h], ctx => { if (a?.bitmap) ctx.drawImage(a.bitmap, 0, 0, box.w, box.h); });
  },
});

/* ---- graph: history of one reading (AIDA64 GRAPH) with a baked grid ---- */
defineWidget({
  type: 'graph', label: 'Graph', cat: 'Graphs', size: { w: 600, h: 160 },
  defaults: () => ({ sensor: 'SCPUUTI', lo: 0, hi: 100, auto: false, type: 'LG', color: '@cpu', thick: 3, step: 3, grid: 3, gridColor: '@grid', base: true, baseColor: '@hair', lineW: 2,
                     aidaBg: false, aidaFrame: false, aidaGrid: false, density: 40, bgCol: '#000000', frameCol: '#1c1f24', gridCol: '#131518' }),
  fields: [
    { k: 'sensor', t: 'sensor', label: 'Sensor' }, { k: 'lo', t: 'num', label: 'Min' }, { k: 'hi', t: 'num', label: 'Max' },
    { k: 'auto', t: 'bool', label: 'Scale to fit' },
    { k: 'type', t: 'select', label: 'Style', opts: [['LG', 'Line'], ['AG', 'Area'], ['HG', 'Histogram']], hint: 'Lines light the fewest OLED pixels.' },
    { k: 'color', t: 'color', label: 'Colour' }, { k: 'thick', t: 'int', label: 'Line width', min: 1, max: 20 },
    { k: 'step', t: 'int', label: 'Pixels per sample', min: 1, max: 40, hint: 'At one sample a second, width ÷ this is the seconds of history.' },
    { section: 'Grid', fields: [{ k: 'grid', t: 'int', label: 'Lines', min: 0, max: 20 }, { k: 'gridColor', t: 'color', label: 'Colour' },
      { k: 'base', t: 'bool', label: 'Baseline' }, { k: 'baseColor', t: 'color', label: 'Baseline colour' }, { k: 'lineW', t: 'num', label: 'Line width', min: 1, max: 10 }] },
    { section: 'Drawn by AIDA64', fields: [
      { k: 'aidaBg', t: 'bool', label: 'Background fill', hint: 'AIDA64 fills the graph area. Lights pixels on OLED.' }, { k: 'bgCol', t: 'color', label: 'Fill', show: p => p.aidaBg },
      { k: 'aidaFrame', t: 'bool', label: 'Frame' }, { k: 'frameCol', t: 'color', label: 'Frame colour', show: p => p.aidaFrame },
      { k: 'aidaGrid', t: 'bool', label: 'AIDA64 grid' }, { k: 'gridCol', t: 'color', label: 'Grid colour', show: p => p.aidaGrid }, { k: 'density', t: 'int', label: 'Grid spacing', min: 2, max: 400, show: p => p.aidaGrid }] },
  ],
  sensors: p => [p.sensor],
  sanitize(p, raw) { if (raw.slabel) p.slabel = sStr(raw.slabel, 80); },
  emit(P, p, box) {
    for (let i = 1; i <= p.grid; i++) P.rect(0, box.h * i / (p.grid + 1) - p.lineW / 2, box.w, p.lineW, p.gridColor);
    if (p.base) P.rect(0, box.h - p.lineW / 2, box.w, p.lineW, p.baseColor);
    const flags = `${p.aidaBg ? 1 : 0}${p.aidaFrame ? 1 : 0}${p.aidaGrid ? 1 : 0}`, custom = flags !== '000' || p.density !== 40;
    P.item({ kind: 'GRAPH', sensor: p.sensor, slabel: p.slabel || sensorLabel(p.sensor, P.env), x: 0, y: 0, w: box.w, h: box.h, lo: p.lo, hi: p.hi, col: P.col(p.color),
             auto: p.auto, step: p.step, thick: p.thick, type: p.type,
             ...(custom ? { flags, density: p.density, bgCol: P.col(p.bgCol), frameCol: P.col(p.frameCol), gridCol: P.col(p.gridCol) } : {}) }, [0, 0, box.w, box.h]);
  },
});

/* ---- segmented bar: 15 segments per gauge (more stack several gauges), horizontal or vertical ---- */
function segColors(p, env, segs) {
  const base = colorOf(p.color, env.doc), warn = colorOf(p.warnColor || '@amber', env.doc), hot = colorOf(p.hotColor || '@red', env.doc);
  return Array.from({ length: segs }, (_, j) => {
    if (p.paint === 'heat') { const t = p.lo + (j + 1) * (p.hi - p.lo) / segs; return t > env.doc.hot ? hot : t > env.doc.warm ? warn : base; }

<script>
/* ================================================================ gauges: ring (Modern Split), dial and meter (Classic OLED),
   and the widgets that hold items from opened panels (custom gauges, AIDA64's own gauges, sensor items, unknown items) */

/* ---- ring: segmented arc, as the builder's ring(): SPAN-degree segments every PITCH degrees, 5 segments per gauge ---- */
defineWidget({
  type: 'ring', label: 'Segmented ring', cat: 'Gauges', resize: 'aspect',
  defaults: () => ({ sensor: 'SCPUUTI', lo: 0, hi: 100, r0: 346, r1: 380, segs: 30, start: -135, pitch: 9, span: 7, paint: 'solid', color: '@cpu', track: '@track' }),
  fields: [
    { k: 'sensor', t: 'sensor', label: 'Sensor' }, { k: 'lo', t: 'num', label: 'Min' }, { k: 'hi', t: 'num', label: 'Max' },
    { k: 'paint', t: 'select', label: 'Colours', opts: [['solid', 'One colour'], ['heat', 'Warm / hot temperatures']] },
    { k: 'color', t: 'color', label: 'Colour' }, { k: 'track', t: 'color', label: 'Track' },
    { section: 'Shape', fields: [
      { k: 'r1', t: 'num', label: 'Outer radius', min: 10, max: 3000 }, { k: 'r0', t: 'num', label: 'Inner radius', min: 1, max: 3000 },
      { k: 'segs', t: 'int', label: 'Segments', min: 3, max: 120 }, { k: 'start', t: 'num', label: 'Start angle', min: -360, max: 360 },
      { k: 'pitch', t: 'num', label: 'Degrees per segment', min: 1, max: 120 }, { k: 'span', t: 'num', label: 'Segment length °', min: .5, max: 120 },
    ] },
  ],
  sensors: p => [p.sensor],
  measure: p => { const s = Math.floor(2 * p.r1 + 8); return { w: s, h: s }; },
  anchor: () => 'c',
  scale(p, f) { p.r0 *= f; p.r1 *= f; },
  emit(P, p) {
    const size = Math.floor(2 * p.r1 + 8), c = size / 2, segs = Math.max(1, Math.round(p.segs)), seg = (p.hi - p.lo) / segs;
    const ang = k => { const a0 = p.start + k * p.pitch + (p.pitch - p.span) / 2; return [a0, a0 + p.span]; };
    const cols = segColors(p, P.env, segs), track = P.col(p.track);
    P.custom([0, 0, size, size], ctx => { ctx.fillStyle = cssRgb(track); for (let k = 0; k < segs; k++) { const [a, b] = ang(k); poly(ctx, arcPts(c, c, p.r0, p.r1, a, b)); } });
    const chunk = [5, 3, 15, 1].find(n => segs % n === 0), slabel = sensorLabel(p.sensor, P.env);
    for (let si = 0; si < segs / chunk; si++) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (let k = si * chunk; k < si * chunk + chunk; k++) { const [a, b] = ang(k); for (const [px, py] of arcPts(c, c, p.r0, p.r1, a, b)) { x0 = Math.min(x0, px); y0 = Math.min(y0, py); x1 = Math.max(x1, px); y1 = Math.max(y1, py); } }
      const bx = Math.floor(x0) - 2, by = Math.floor(y0) - 2, bw = Math.ceil(x1) + 2 - bx, bh = Math.ceil(y1) + 2 - by;
      const mine = cols.slice(si * chunk, si * chunk + chunk);
      const names = P.frames('ring', ['ring', p.r0, p.r1, p.start, p.pitch, p.span, si, chunk, mine], chunk + 1, bw, bh, (ctx, n) => {
        ctx.setTransform(1, 0, 0, 1, -bx, -by);
        for (let k = si * chunk; k < si * chunk + n; k++) { const [a, b] = ang(k); ctx.fillStyle = cssRgb(cols[k]); poly(ctx, arcPts(c, c, p.r0, p.r1, a, b)); }
      });
      const smin = p.lo + si * chunk * seg;
      P.item({ kind: 'GAUGE', sensor: p.sensor, slabel, lo: smin, hi: smin + chunk * seg, x: bx, y: by,
               frames: Array.from({ length: 16 }, (_, s) => names[Math.floor(s * chunk / 15)]), showVal: false, pt: 8, font: 'Tahoma', col: [255, 255, 255] }, [bx, by, bw, bh]);
    }
  },
});

/* ---- dial: analog instrument (Classic OLED). Geometry from gen.py, scaled by r / R. ---- */
const DIAL_G = {
  big: { R: 520, bez: 514, bez2: 500, rt: 478, maj: [52, 8], mid: [34, 4.5], mnr: [20, 3], nfont: 84, gap: 18, bezW: 5, redW: 11, tip: 462, tail: 74, wbase: 18, wtip: 4, hub: 40, positions: 40, over: 5 },
  small: { R: 240, bez: 236, bez2: 226, rt: 214, maj: [30, 5], mid: [20, 3], mnr: [12, 2.2], nfont: 40, gap: 10, bezW: 4, redW: 6, tip: 202, tail: 36, wbase: 10, wtip: 3, hub: 20, positions: 25, over: 7 },
};
const frange = (lo, hi, step) => { const n = Math.round((hi - lo) / step); return Array.from({ length: n + 1 }, (_, i) => lo + i * step); };
const rnd6 = v => Math.round(v * 1e6) / 1e6;
function needlePts(G, s, c, th) {
  const t = th * Math.PI / 180, ux = Math.sin(t), uy = -Math.cos(t), vx = Math.cos(t), vy = Math.sin(t);
  const P = (r, off) => [c + (ux * r + vx * off) * s, c + (uy * r + vy * off) * s];
  const tip = G.tip, tail = G.tail, wb = G.wbase, wt = G.wtip;
  return { tail: [P(-tail, -wb * .62), P(-tail, wb * .62), P(0, wb / 2), P(0, -wb / 2)], body: [P(0, -wb / 2), P(tip - 14, -wt / 2), P(tip, 0), P(tip - 14, wt / 2), P(0, wb / 2)] };
}
defineWidget({
  type: 'dial', label: 'Needle dial', cat: 'Gauges', resize: 'aspect',
  defaults: () => ({ sensor: 'TCPUPKG', lo: 20, hi: 100, style: 'big', r: 520, major: 20, mid: 10, minor: 2, red: true, redFrom: 90, redTo: 100, numbers: true,
                     needle: '@needle', tail: '@tail', bezel: '@bezel', bezel2: '@bezel2', majorCol: '@major', midCol: '@cmid', minorCol: '@minor', redCol: '@cred',
                     redMinor: '@redminor', redBand: '@redband', numCol: '@num', hubFill: '@hubfill', hubRing: '@hubring', hubDot: '@hubdot' }),
  fields: [
    { k: 'sensor', t: 'sensor', label: 'Sensor' }, { k: 'lo', t: 'num', label: 'Min' }, { k: 'hi', t: 'num', label: 'Max' },
    { k: 'major', t: 'num', label: 'Numbered every', min: 0 }, { k: 'mid', t: 'num', label: 'Mid ticks every', min: 0, hint: '0 = none' }, { k: 'minor', t: 'num', label: 'Small ticks every', min: 0 },
    { k: 'red', t: 'bool', label: 'Red zone' }, { k: 'redFrom', t: 'num', label: 'Red from', show: p => p.red }, { k: 'redTo', t: 'num', label: 'Red to', show: p => p.red },
    { k: 'style', t: 'select', label: 'Needle steps', opts: [['big', 'Fine (41 positions)'], ['small', 'Medium (26 positions)']] },
    { k: 'needle', t: 'color', label: 'Needle' },
    { section: 'Colours', fields: [{ k: 'majorCol', t: 'color', label: 'Major ticks' }, { k: 'midCol', t: 'color', label: 'Mid ticks' }, { k: 'minorCol', t: 'color', label: 'Small ticks' },
      { k: 'numCol', t: 'color', label: 'Numbers' }, { k: 'redCol', t: 'color', label: 'Red ticks' }, { k: 'redBand', t: 'color', label: 'Red band' },
      { k: 'bezel', t: 'color', label: 'Bezel' }, { k: 'tail', t: 'color', label: 'Needle tail' }, { k: 'hubRing', t: 'color', label: 'Hub ring' }] },
    { k: 'numbers', t: 'bool', label: 'Scale numbers' },
  ],
  sensors: p => [p.sensor],
  measure: p => ({ w: 2 * p.r, h: 2 * p.r }),
  anchor: () => 'c',
  scale(p, f) { p.r *= f; },
  emit(P, p) {
    const G = DIAL_G[p.style] || DIAL_G.big, s = p.r / G.R, c = p.r, lo = p.lo, hi = p.hi > p.lo ? p.hi : p.lo + 1;
    const angle = v => -120 + 240 * (v - lo) / (hi - lo);
    const inRed = v => p.red && v >= p.redFrom - 1e-9 && v <= p.redTo + 1e-9;
    const col = k => P.col(p[k]);
    /* face */
    P.circle(c, c, G.bez * s, G.bezW * s, p.bezel);
    P.circle(c, c, G.bez2 * s, 2 * s, p.bezel2);
    if (p.red) {

      const pol = (r, th) => [c + r * s * Math.sin(th * Math.PI / 180), c - r * s * Math.cos(th * Math.PI / 180)];
      for (let i = 0; i <= n; i++) pts.push(pol(G.rt, a0 + (a1 - a0) * i / n));
      for (let i = 0; i <= n; i++) pts.push(pol(G.rt - G.redW, a1 - (a1 - a0) * i / n));
      P.poly(pts, p.redBand);
    }
    const majors = new Set(p.major > 0 ? frange(lo, hi, p.major).map(rnd6) : []), mids = new Set(p.mid > 0 ? frange(lo, hi, p.mid).map(rnd6) : []);
    const ticks = p.minor > 0 ? frange(lo, hi, p.minor) : [...majors];

        const t = angle(v) * Math.PI / 180, ux = Math.sin(t), uy = -Math.cos(t), vx = Math.cos(t), vy = Math.sin(t), r0 = (G.rt - ln) * s, r1 = G.rt * s, hw = w * s / 2;
        poly(ctx, [[c + ux * r0 - vx * hw, c + uy * r0 - vy * hw], [c + ux * r1 - vx * hw, c + uy * r1 - vy * hw], [c + ux * r1 + vx * hw, c + uy * r1 + vy * hw], [c + ux * r0 + vx * hw, c + uy * r0 + vy * hw]]);
      }
    });
    if (p.numbers) for (const v of [...majors].sort((a, b) => a - b)) {
      const th = angle(v), label = String(Math.round(v)), px = G.nfont * s, ib = inkBox(label, px, 'med', 'bsc');
      const tw = ib.r - ib.l, thh = ib.b - ib.t, ext = Math.abs(Math.sin(th * Math.PI / 180)) * tw / 2 + Math.abs(Math.cos(th * Math.PI / 180)) * thh / 2;
      const r = (G.rt - G.maj[0] - G.gap) * s - ext;
      P.textInk(c + r * Math.sin(th * Math.PI / 180), c - r * Math.cos(th * Math.PI / 180), label, { px, weight: 'med', family: 'bsc', col: inRed(v) ? p.redCol : p.numCol });
    }

    const n = G.positions, step = (hi - lo) / n, plan = planExclusive(n), slabel = sensorLabel(p.sensor, P.env);
    const thOf = q => q === 'over' ? 120 + G.over : -120 + 240 * q / n;
    const nCol = col('needle'), tCol = col('tail');

      for (const q of g.states) if (q !== null) { const np = needlePts(G, s, c, thOf(q)); for (const [x, y] of [...np.tail, ...np.body]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } }
      const bx = Math.floor(x0) - 2, by = Math.floor(y0) - 2, bw = Math.ceil(x1) + 2 - bx, bh = Math.ceil(y1) + 2 - by;
      const names = P.frames('needle', ['needle', p.style, s, nCol, tCol, gi, g.states], 16, bw, bh, (ctx, st) => {
        const q = g.states[st]; if (q === null) return;
        const np = needlePts(G, s, c, thOf(q)); ctx.translate(-bx, -by);
        ctx.fillStyle = cssRgb(tCol); poly(ctx, np.tail); ctx.fillStyle = cssRgb(nCol); poly(ctx, np.body);
      });
      P.item({ kind: 'GAUGE', sensor: p.sensor, slabel, lo: lo + g.base * step, hi: lo + (g.base + 15) * step, x: bx, y: by, frames: g.states.map((q, st) => q === null ? '' : names[st]),

    });
